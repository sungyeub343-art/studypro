name: Daily site update (KST)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check scheduled hour
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_HOUR_KST: ${{ vars.DAILY_PUBLISH_HOUR_KST }}
        run: |
          hour="${PUBLISH_HOUR_KST:-3}"
          if ! [[ "$hour" =~ ^([0-9]|1[0-9]|2[0-3])$ ]]; then
            echo "::error::DAILY_PUBLISH_HOUR_KST must be an integer from 0 to 23."
            exit 1
          fi

          current_hour="$(TZ=Asia/Seoul date +%-H)"
          if [[ "$EVENT_NAME" == "schedule" && "$current_hour" != "$hour" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: current KST hour is ${current_hour}, configured hour is ${hour}."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate and validate pages
        if: steps.schedule.outputs.run == 'true'
        run: python tools/generate_locality_pages.py

      - name: Publish updates
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi

          publish_date="$(TZ=Asia/Seoul date +%F)"
          git commit -m "Daily site update: ${publish_date}"
          git push
